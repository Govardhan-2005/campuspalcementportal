<html>
    <head><title>feedback form</title>    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
    .card {
        background:transparent;
        max-width: 500px;
        backdrop-filter:blur(10px);
        margin: 0 auto;
        padding: 20px;
        border: 1px solid #ccc;
        border-radius: 5px;
           font-size:35px;
            font-weight:bold;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
    }
    .card {
    animation: popup 0.5s ease;
}

@keyframes popup {
    0% {
        transform: scale(0);
        opacity: 0;
    }
    70% {
        transform: scale(1.1);
    }
    100% {
        transform: scale(1);
        opacity: 1;
    }
}
h1{text-align:center;}
body{background-image:url("https://png.pngtree.com/thumb_back/fh260/background/20240912/pngtree-the-best-company-to-outsource-software-developers-codebased-creations-image_16161276.jpg");
background-size:cover;
filter:blur(0.5px);
color:white;
}
label{color:white;}
</style>
    </head>
    <body>
        <h1>Feedback Form</h1><br><br>
        <div class="card">
        <form action="/submit_feedback" method="post">
            <label for="name">Name:</label><br>
            <input type="text" id="name" name="name"><br><br>
            <label for="email">Email:</label><br>
            <input type="email" id="email" name="email"><br><br>
            <label for="feedback">Feedback:</label><br>
            <textarea id="feedback" name="feedback"></textarea><br><br>
            <input type="submit" value="Submit">
        </form>
        </div>

        </body>
</html>
