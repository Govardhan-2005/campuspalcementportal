<html>
    <head><title>feedback form</title>    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
    .card {
        background:transparent;
        max-width: 500px;
        backdrop-filter:blur(10px);
        margin: 0 auto;
        padding: 20px;
        border: 1px solid #ccc;
        border-radius: 5px;
           font-size:35px;
            font-weight:bold;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
    }
    .card {
    animation: popup 0.5s ease;backdrop-filter:blur(20px);
}

@keyframes popup {
    0% {
        transform: scale(0);
        opacity: 0;
    }
    70% {
        transform: scale(1.1);
    }
    100% {
        transform: scale(1);
        opacity: 1;
    }
}
h1{text-align:center;}
body{background-image:url("https://static.wixstatic.com/media/c54b2a_09d73cc5ff064d139c28b3c1366bc912~mv2.jpg/v1/fill/w_1000,h_491,al_c,q_85/c54b2a_09d73cc5ff064d139c28b3c1366bc912~mv2.jpg");
background-size:cover;
filter:blur(0.5px);
color:white;
}
label{color:white;}
input,textarea {
    border-radius: 10px;
}
.card:hover{background-color:rgba(0,0,0,0.5);backdrop-filter:blur(10px);}
</style>
    </head>
    <body>
        <h1>Feedback Form</h1><br><br>
        <div class="card">
        <form action="/submit_feedback" method="post">
            <label for="name">Name:</label><br>
            <input type="text" id="name" name="name"><br><br>
            <label for="email">Email:</label><br>
            <input type="email" id="email" name="email"><br><br>
            <label for="feedback">Feedback:</label><br>
            <textarea id="feedback" name="feedback"></textarea><br><br>
            <input type="submit" value="submit"class="btn btn-secondary">
        </form>
        </div>

        </body>
</html>
